<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Avatar estilizado similar à referência -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo circular -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad)" opacity="0.9"/>
  
  <!-- Corpo / Camiseta -->
  <ellipse cx="200" cy="380" rx="120" ry="60" fill="#1a1a2e"/>
  
  <!-- Pescoço -->
  <rect x="170" y="280" width="60" height="40" fill="#d4a574" rx="8"/>
  
  <!-- Cabeça -->
  <ellipse cx="200" cy="180" rx="90" ry="100" fill="#d4a574"/>
  
  <!-- Cabelo -->
  <ellipse cx="200" cy="100" rx="85" ry="50" fill="#2d1b0e"/>
  <ellipse cx="200" cy="120" rx="90" ry="40" fill="#2d1b0e"/>
  
  <!-- Óculos -->
  <g fill="none" stroke="#1a1a2e" stroke-width="6">
    <rect x="115" y="160" width="60" height="45" rx="8"/>
    <rect x="225" y="160" width="60" height="45" rx="8"/>
    <line x1="175" y1="180" x2="225" y2="180"/>
    <line x1="105" y1="180" x2="115" y2="180"/>
    <line x1="285" y1="180" x2="295" y2="180"/>
  </g>
  
  <!-- Olhos (atrás dos óculos) -->
  <ellipse cx="145" cy="182" rx="8" ry="6" fill="#1a1a2e"/>
  <ellipse cx="255" cy="182" rx="8" ry="6" fill="#1a1a2e"/>
  
  <!-- Sobrancelhas -->
  <path d="M120 150 Q145 140 170 150" stroke="#2d1b0e" stroke-width="4" fill="none"/>
  <path d="M230 150 Q255 140 280 150" stroke="#2d1b0e" stroke-width="4" fill="none"/>
  
  <!-- Nariz -->
  <path d="M200 190 Q205 210 200 225" stroke="#c49a6c" stroke-width="3" fill="none"/>
  
  <!-- Boca (sorriso) -->
  <path d="M170 250 Q200 270 230 250" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Orelhas -->
  <ellipse cx="110" cy="190" rx="15" ry="25" fill="#d4a574"/>
  <ellipse cx="290" cy="190" rx="15" ry="25" fill="#d4a574"/>
</svg>
